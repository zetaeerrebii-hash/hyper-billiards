name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verifica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Build aggiornata (index.html e dist/ coincidono con src/)
        run: python3 tools/build.py --check
      - name: Test dei punteggi
        run: node tests/scoring.test.js
      - name: Prova nel browser (pianta, 3D, telefono)
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          npm run smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: screenshot, path: tests/smoke-*.png, if-no-files-found: ignore }
